[project]
name = "reasercher"
version = "0.1.0"
description = "reasercher using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
reasercher = "reasercher.main:run"
run_crew = "reasercher.main:run"
train = "reasercher.main:train"
replay = "reasercher.main:replay"
test = "reasercher.main:test"
run_with_trigger = "reasercher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
